# ============================================================================
# OPENAGRIOS - HEADLESS CORE PaaS & OPERATIONS PORTAL (100% PERMISSIVE OPEN SOURCE)
# Toàn bộ các thành phần hạ tầng sử dụng giấy phép Apache-2.0 / BSD-style (PostgreSQL)
# Tất cả phiên bản image đều được pin cố định (không dùng :latest)
# ============================================================================

services:

  # 1. STRUCTURED DATA & RLS ENGINE (PostgreSQL 16 - Permissive BSD/MIT-style License)
  postgres:
    image: postgres:16.2-alpine
    container_name: openagrios-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openagrios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openagrios_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-openagrios_db}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-openagrios_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-openagrios_app_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - ./infra/db/docker-entrypoint-sync.sh:/entrypoint-sync.sh:ro
      - ./infra/db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "/entrypoint-sync.sh", "postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openagrios} -d ${POSTGRES_DB:-openagrios_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. IDENTITY / SSO / RBAC / MULTI-TENANCY (Keycloak 24 - Apache-2.0 License)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: openagrios-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: ${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:-agriops-gateway-secret-2026}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/openagrios-realm.json:/opt/keycloak/data/import/openagrios-realm.json:ro
      - ./infra/keycloak/themes/openagrios:/opt/keycloak/themes/openagrios:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. UNSTRUCTURED S3 OBJECT STORAGE (SeaweedFS S3 - Apache-2.0 License, Pinned v3.64)
  object-storage:
    image: chrislusf/seaweedfs:3.64
    container_name: openagrios-s3-storage
    command: "server -s3 -s3.port=9000 -dir=/data"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8888:8888"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. WORKFLOW ENGINE (Flowable BPMN 2.0 REST - Apache-2.0 License, Pinned v7.0.0)
  flowable:
    image: flowable/flowable-rest:7.0.0
    container_name: openagrios-flowable
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openagrios_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-openagrios}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-openagrios_dev_only}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # 5. ZERO-TRUST API GATEWAY (Apache APISIX Standalone - Apache-2.0 License, Pinned v3.9.0)
  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: openagrios-apisix
    environment:
      APISIX_STAND_ALONE: "true"
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: ${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:-agriops-gateway-secret-2026}
    ports:
      - "9080:9080"
    volumes:
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - core-api
      - web-app

  # 6. OPENAGRIOS HEADLESS CORE API (Java 21 LTS - Apache-2.0 License)
  core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openagrios-core-api
    environment:
      PORT: 8000
      OPENAGRIOS_AUTH_MODE: KEYCLOAK_PRODUCTION
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/openagrios
      KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_ISSUER:-http://localhost:8080/realms/openagrios}
      S3_ENDPOINT: http://object-storage:9000
      FLOWABLE_REST_URL: http://flowable:8081/flowable-rest
      FLOWABLE_ENDPOINT: http://flowable:8081/flowable-rest
      FLOWABLE_REST_USER: ${FLOWABLE_REST_USER:-rest-admin}
      FLOWABLE_REST_PASSWORD: ${FLOWABLE_REST_PASSWORD:-test}
      OPENAGRIOS_WORKFLOW_MODE: ${OPENAGRIOS_WORKFLOW_MODE:-FLOWABLE_PRODUCTION}
      OPENAGRIOS_STORAGE_MODE: ${OPENAGRIOS_STORAGE_MODE:-POSTGRESQL_PRODUCTION}
      DATABASE_URL: jdbc:postgresql://postgres:5432/openagrios_db
      POSTGRES_USER: ${POSTGRES_APP_USER:-openagrios_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-openagrios_app_dev_only}
      KEYCLOAK_INTROSPECTION_CLIENT_ID: ${KEYCLOAK_INTROSPECTION_CLIENT_ID:-agriops-gateway}
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: ${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:-agriops-gateway-secret-2026}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-agriops-client-secret-2026}
      OPENAGRIOS_EVENT_BUS_URL: http://kafka-rest:8082
      OPENAGRIOS_ANALYTICS_URL: http://lake-archiver:8090
      OPENAGRIOS_INGEST_TOKEN: ${OPENAGRIOS_INGEST_TOKEN:-ingest_dev_only_token}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      object-storage:
        condition: service_started
      flowable:
        condition: service_started
      kafka-rest:
        condition: service_healthy

  # 7. OPENAGRIOS EXPERIENCE & OPERATIONS PORTAL (H-P-D-I Web Application)
  web-app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Demo character picker + storyline panel; compose.prod.yaml turns it off
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    container_name: openagrios-web-app
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:9080}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 8. EVENT BUS — HOT PATH (Apache Kafka 3.7, KRaft single node, no ZooKeeper - Apache-2.0 License)
  kafka:
    image: apache/kafka:3.7.1
    container_name: openagrios-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # 8b. Idempotent topic bootstrap (re-runs on every `up`; --if-not-exists makes it safe)
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: openagrios-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in openagrios.audit.v1 openagrios.telemetry.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists             --topic $$t --partitions 1 --replication-factor 1 || exit 1
        done

  # 8c. Kafka REST Proxy (Karapace - Apache-2.0 License): HTTP produce/consume so the Java core needs no Kafka client
  kafka-rest:
    image: ghcr.io/aiven-open/karapace:4.1.0
    container_name: openagrios-kafka-rest
    entrypoint: ["/bin/sh", "-c", "/opt/karapace/start.sh rest"]
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8082
      KARAPACE_ADMIN_METADATA_MAX_AGE: 0
      KARAPACE_LOG_LEVEL: INFO
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/topics', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 9. COLD TIER — consumes the bus, writes Parquet to S3, answers analytics with DuckDB (internal-only port)
  lake-archiver:
    build:
      context: ./services/lake-archiver
    container_name: openagrios-lake-archiver
    restart: unless-stopped
    environment:
      EVENT_BUS_URL: http://kafka-rest:8082
      LAKE_S3_ENDPOINT: object-storage:9000
      LAKE_BUCKET: ${LAKE_BUCKET:-openagrios-lake}
      PORT: 8090
    depends_on:
      kafka-rest:
        condition: service_healthy
      object-storage:
        condition: service_started

  # 10. OT TELEMETRY BROKER (Eclipse Mosquitto 2 - EPL-2.0 / EDL-1.0). Users + ACL are regenerated on every start.
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: openagrios-mosquitto
    restart: unless-stopped
    environment:
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-device}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-device_dev_only}
      MQTT_INGESTOR_USER: ${MQTT_INGESTOR_USER:-ingestor}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:-ingestor_dev_only}
    entrypoint: ["/bin/sh", "/mosquitto/src/entrypoint.sh"]
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-18830}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/src/mosquitto.conf:ro
      - ./infra/mosquitto/entrypoint.sh:/mosquitto/src/entrypoint.sh:ro
      - mqttdata:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 11. MQTT -> validate -> Core API internal endpoint (digital twin + Kafka telemetry topic)
  telemetry-ingestor:
    build:
      context: ./services/telemetry
    container_name: openagrios-telemetry-ingestor
    restart: unless-stopped
    command: ["python", "ingestor.py"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: ${MQTT_INGESTOR_USER:-ingestor}
      MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD:-ingestor_dev_only}
      CORE_URL: http://core-api:8000
      INGEST_TOKEN: ${OPENAGRIOS_INGEST_TOKEN:-ingest_dev_only_token}
    depends_on:
      mosquitto:
        condition: service_healthy
      core-api:
        condition: service_started

  # 12. DEVICE SIMULATOR - demo only, no physical hardware. Enable with: docker compose --profile demo up -d
  #     (kept off by default so deterministic tests are not perturbed by moving machines)
  device-simulator:
    profiles: ["demo"]
    build:
      context: ./services/telemetry
    container_name: openagrios-device-simulator
    restart: unless-stopped
    command: ["python", "simulator.py"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: ${MQTT_DEVICE_USER:-device}
      MQTT_PASSWORD: ${MQTT_DEVICE_PASSWORD:-device_dev_only}
      CORE_URL: http://core-api:8000
      INGEST_TOKEN: ${OPENAGRIOS_INGEST_TOKEN:-ingest_dev_only_token}
      # Demo time-lapse (1 = real speed): makes harvesters visibly move on the map
      SIM_TIMELAPSE: ${SIM_TIMELAPSE:-12}
    depends_on:
      mosquitto:
        condition: service_healthy
      core-api:
        condition: service_started

  # 13. TIER-3 DOMAIN MODULE: rice traceability. Read-only on the cold lake; independently re-verifies the SHA-256 chain.
  traceability:
    build:
      context: ./apps/traceability
    container_name: openagrios-traceability
    restart: unless-stopped
    environment:
      PORT: 8095
      LAKE_S3_ENDPOINT: object-storage:9000
      LAKE_BUCKET: ${LAKE_BUCKET:-openagrios-lake}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9080}
      TRACE_DISCLAIMER: "${TRACE_DISCLAIMER:-Dữ liệu minh họa - hệ thống đang chạy ở chế độ demo, thiết bị là mô phỏng.}"
    depends_on:
      lake-archiver:
        condition: service_started

volumes:
  pgdata:
  s3data:
  kafkadata:
  mqttdata:
