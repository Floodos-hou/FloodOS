# OT telemetry broker (Eclipse Mosquitto, EPL-2.0 / EDL-1.0).
# Users and ACLs are regenerated from environment variables by entrypoint.sh on every start,
# so the broker is fully reproducible from a clean volume.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
