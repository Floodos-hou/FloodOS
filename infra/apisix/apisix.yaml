# ============================================================================
# APACHE APISIX — ZERO-TRUST API GATEWAY CONFIGURATION (Apache-2.0 License)
# Thực thi biên mạng Zero-Trust, kiểm tra JWT OIDC Keycloak, Rate Limit & CORS
# Điều phối lưu lượng: API Backend Core & Experience Web Portal
# ============================================================================
routes:
  # 0. Internal service-to-service endpoints are NEVER reachable through the edge (Zero-Trust).
  #    The telemetry ingestor talks to core-api directly on the container network with a shared secret.
  - id: openagrios-block-internal-route
    name: "Block /api/v1/internal/* at the edge"
    priority: 100
    uris:
      - "/api/v1/internal/*"
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: '{"error":"NOT_FOUND"}'

  # 0b. Tier-3 public traceability pages (consumers scan a QR code: no login, read-only, rate limited, redacted by design)
  - id: openagrios-public-trace-route
    name: "Public rice traceability (Tier 3)"
    priority: 30
    uris:
      - "/trace/*"
    methods: ["GET", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "traceability:8095": 1
    plugins:
      limit-req:
        rate: 20
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr

  # 1. Public Discovery, Health, and Login Route (No Token Required)
  - id: openagrios-public-discovery-route
    name: "OpenAgriOS Public Manifest & Login Route"
    priority: 20
    uris:
      - "/api/v1"
      - "/api/v1/health"
      - "/api/v1/auth/accounts"
      - "/api/v1/auth/login"
      - "/api/v1/auth/pkce/authorize-url"
      - "/api/v1/auth/pkce/token"
      - "/api/v1/auth/pkce/*"
    methods: ["GET", "POST", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "core-api:8000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Authorization,Content-Type"
      limit-req:
        rate: 100
        burst: 50
        rejected_code: 429
        key_type: var
        key: remote_addr

  # 2. Zero-Trust Protected Core API Route (Enforced via Keycloak OIDC Token Introspection)
  - id: openagrios-protected-core-route
    name: "OpenAgriOS Zero-Trust Protected Core API Route"
    priority: 10
    uris:
      - "/api/v1/*"
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "core-api:8000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Correlation-Id,X-Org-Id,X-User-Id,X-User-Roles"
      limit-req:
        rate: 50
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr
      openid-connect:
        client_id: "agriops-gateway"
        client_secret: "${{KEYCLOAK_INTROSPECTION_CLIENT_SECRET:=agriops-gateway-secret-2026}}"
        discovery: "http://keycloak:8080/realms/openagrios/.well-known/openid-configuration"
        bearer_only: true
        realm: "openagrios"
        introspection_endpoint: "http://keycloak:8080/realms/openagrios/protocol/openid-connect/token/introspect"
      proxy-rewrite:
        headers:
          set:
            X-Gateway: "Apache-APISIX-ZeroTrust"

  # 3. OpenAgriOS Experience & Operations Web Portal (H-P-D-I SPA)
  - id: openagrios-web-ui-route
    name: "OpenAgriOS Web UI SPA Route"
    priority: 1
    uris:
      - "/*"
    methods: ["GET", "HEAD", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "web-app:80": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,HEAD,OPTIONS"
#END
