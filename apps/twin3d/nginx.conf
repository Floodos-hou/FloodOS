server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # the twin lives under /twin/ (the gateway routes /twin/* here, everything else to the operations portal)
    location = /twin { return 301 /twin/; }

    location /twin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /twin/index.html;
    }

    # ES-module workers (MapLibre) must be served as JavaScript; stock mime.types has no .mjs entry
    location ~* ^/twin/assets/.+\.mjs$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /twin/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 'OK';
    }
}
