# Included from every location: nginx drops server-level add_header once a location defines its own.
# Same policy as the operations portal, except that imagery may come from the satellite tile server (img-src) and the
# flat map and 3D ground both fetch tiles from the one EOX host.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.maps.eox.at; font-src 'self' data:; connect-src 'self' http://localhost:9080 http://127.0.0.1:9080 https://tiles.maps.eox.at; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
