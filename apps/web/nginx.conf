server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # SPA routing fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # PWA Service Worker (must never be cached)
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # PWA Web Manifest
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ES-module workers (MapLibre) must be served as JavaScript; stock mime.types has no .mjs entry
    location ~* ^/assets/.+\.mjs$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Offline basemap (PMTiles, OpenStreetMap data). Plain static file served with HTTP range requests.
    # A missing file must be a real 404 (not the SPA page) so the map can detect it and fall back to online tiles.
    location /basemap/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Cache static assets
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Health check endpoint
    location /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 'OK';
    }

    # API Gateway Reverse Proxy (Zero-Trust Edge APISIX)
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_gateway http://apisix:9080;
        proxy_pass $backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
