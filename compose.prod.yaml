# ============================================================================
# OPENAGRIOS — PRODUCTION COMPOSE OVERRIDE (compose.prod.yaml)
# Production Hardening Profile for OpenAgriOS Headless Core PaaS Stack
#
# Key Features:
#   1. Mandatory Non-Default Secrets: Enforces ${VAR:?error} syntax — container
#      startup will fail fast if any production secret is missing or empty.
#   2. Network Boundary Hardening: Internal database, S3 storage, BPMN engine,
#      and Core API have their host port publishing reset (ports: !reset []),
#      enforcing that ALL traffic from external clients MUST pass through
#      the APISIX Zero-Trust Gateway (plus Keycloak SSO for browser login).
#   3. Introspection Secret Synchronization: APISIX, Keycloak, and Core API
#      all receive KEYCLOAK_INTROSPECTION_CLIENT_SECRET dynamically.
#   4. Strict Production Mode: OPENAGRIOS_AUTH_MODE=KEYCLOAK_PRODUCTION and
#      OPENAGRIOS_STORAGE_MODE=POSTGRESQL_PRODUCTION (no dev mock fallbacks).
#   5. High Availability: restart: always policy configured across all services.
#
# Usage:
#   cp .env.production.example .env
#   docker compose -f compose.yaml -f compose.prod.yaml config --quiet
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# ============================================================================

services:

  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openagrios}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?CRITICAL POSTGRES_PASSWORD must be explicitly provided in production}"
      POSTGRES_DB: ${POSTGRES_DB:-openagrios_db}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-openagrios_app}
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?CRITICAL POSTGRES_APP_PASSWORD must be explicitly provided in production}"
    entrypoint: ["/bin/sh", "/entrypoint-sync.sh", "postgres"]
    ports: !reset []

  keycloak:
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?CRITICAL KEYCLOAK_ADMIN_PASSWORD must be explicitly provided in production}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_URL: "${KEYCLOAK_PUBLIC_URL:?CRITICAL KEYCLOAK_PUBLIC_URL must be a browser-reachable HTTPS origin in production}"
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: "${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:?CRITICAL KEYCLOAK_INTROSPECTION_CLIENT_SECRET must be explicitly provided in production}"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

  object-storage:
    restart: always
    ports: !reset []

  flowable:
    restart: always
    environment:
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?CRITICAL Database password required for Flowable in production}"
    ports: !reset []

  apisix:
    restart: always
    environment:
      APISIX_STAND_ALONE: "true"
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: "${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:?CRITICAL KEYCLOAK_INTROSPECTION_CLIENT_SECRET must be explicitly provided in production}"
    ports:
      - "${GATEWAY_HTTP_PORT:-9080}:9080"
      - "${GATEWAY_HTTPS_PORT:-9443}:9443"

  kafka:
    restart: always

  kafka-init:
    restart: "no"

  kafka-rest:
    restart: always

  lake-archiver:
    restart: always

  traceability:
    restart: always
    environment:
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?CRITICAL PUBLIC_BASE_URL must be the public HTTPS origin used in the QR codes}"
      TRACE_DISCLAIMER: ""

  mosquitto:
    restart: always
    environment:
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-device}
      MQTT_DEVICE_PASSWORD: "${MQTT_DEVICE_PASSWORD:?CRITICAL MQTT_DEVICE_PASSWORD must be explicitly provided in production}"
      MQTT_INGESTOR_USER: ${MQTT_INGESTOR_USER:-ingestor}
      MQTT_INGESTOR_PASSWORD: "${MQTT_INGESTOR_PASSWORD:?CRITICAL MQTT_INGESTOR_PASSWORD must be explicitly provided in production}"
    ports: !reset []

  telemetry-ingestor:
    restart: always
    environment:
      MQTT_USER: ${MQTT_INGESTOR_USER:-ingestor}
      MQTT_PASSWORD: "${MQTT_INGESTOR_PASSWORD:?CRITICAL MQTT_INGESTOR_PASSWORD must be explicitly provided in production}"
      INGEST_TOKEN: "${OPENAGRIOS_INGEST_TOKEN:?CRITICAL OPENAGRIOS_INGEST_TOKEN must be explicitly provided in production}"

  core-api:
    restart: always
    environment:
      OPENAGRIOS_INGEST_TOKEN: "${OPENAGRIOS_INGEST_TOKEN:?CRITICAL OPENAGRIOS_INGEST_TOKEN must be explicitly provided in production}"
      OPENAGRIOS_AUTH_MODE: KEYCLOAK_PRODUCTION
      KEYCLOAK_PUBLIC_ISSUER: "${KEYCLOAK_PUBLIC_ISSUER:?CRITICAL KEYCLOAK_PUBLIC_ISSUER must match the Keycloak realm issuer}"
      OPENAGRIOS_STORAGE_MODE: POSTGRESQL_PRODUCTION
      OPENAGRIOS_STRICT_RFC9700: "${OPENAGRIOS_STRICT_RFC9700:-true}"
      POSTGRES_USER: ${POSTGRES_APP_USER:-openagrios_app}
      POSTGRES_PASSWORD: "${POSTGRES_APP_PASSWORD:?CRITICAL POSTGRES_APP_PASSWORD must be explicitly provided in production}"
      KEYCLOAK_INTROSPECTION_CLIENT_ID: ${KEYCLOAK_INTROSPECTION_CLIENT_ID:-agriops-gateway}
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: "${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:?CRITICAL KEYCLOAK_INTROSPECTION_CLIENT_SECRET must be explicitly provided in production}"
    ports: !reset []

  web-app:
    build:
      args:
        VITE_DEMO_MODE: "false"
    restart: always
    ports: !reset []
