name: FloodOS CI

on:
  push:
    branches: [ "main", "tier-1-core" ]
  pull_request:
    branches: [ "main", "tier-1-core" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Eclipse Temurin)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js 22 (Active LTS)
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'apps/web/package-lock.json'

    - name: Compile Core, Apps, and Tests (POSIX standard)
      run: |
        mkdir -p target/classes
        find core apps tests -name "*.java" > sources.txt
        javac -encoding UTF-8 -d target/classes @sources.txt

    - name: Install Frontend Dependencies
      working-directory: apps/web
      run: npm ci

    - name: Run Web Logic Tests
      working-directory: apps/web
      run: npm run test

    - name: Run Web UI Workspace Tests
      working-directory: apps/web
      run: npm run test:ui

    - name: Build Web Application
      working-directory: apps/web
      run: npm run build

    - name: Run Unit Tests (Java + Python, incl. DuckDB/Parquet round-trips)
      run: bash tests/run_unit_tests.sh

    - name: Run In-Process Acceptance Tests (FloodOS golden path over real HTTP)
      run: |
        java -Dfile.encoding=UTF-8 -cp target/classes org.floodos.tests.AcceptanceTestRunner

    - name: Validate Docker Compose Stack Specification
      run: |
        docker compose -f compose.yaml config --quiet
        echo "Docker Compose stack configuration validated successfully!"

    - name: Validate Production Compose Override Specification
      run: |
        POSTGRES_PASSWORD=ci_test_pg_pw \
        POSTGRES_APP_PASSWORD=ci_test_app_pw \
        KEYCLOAK_ADMIN_PASSWORD=ci_test_kc_pw \
        KEYCLOAK_INTROSPECTION_CLIENT_SECRET=ci_test_secret \
        KEYCLOAK_PUBLIC_URL=https://sso.example.test \
        KEYCLOAK_PUBLIC_ISSUER=https://sso.example.test/realms/floodos \
        MQTT_DEVICE_PASSWORD=ci_test_mqtt_device_pw \
        MQTT_INGESTOR_PASSWORD=ci_test_mqtt_ingestor_pw \
        FLOODOS_INGEST_TOKEN=ci_test_ingest_token \
        PUBLIC_BASE_URL=https://trace.example.test \
        docker compose -f compose.yaml -f compose.prod.yaml config --quiet
        echo "Production Docker Compose override validated successfully!"

    - name: Run Full-Stack Container Integration Tests
      run: |
        chmod +x tests/e2e_full_stack_test.sh
        bash tests/e2e_full_stack_test.sh
